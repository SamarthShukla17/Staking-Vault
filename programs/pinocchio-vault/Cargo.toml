[package]
name = "pinocchio_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

# Detaching from root Anchor workspace
[workspace]

[dependencies]
pinocchio                   = { version = "0.11", features = ["cpi"] }
pinocchio-token             = "0.7.0"
pinocchio-system            = "0.6"
pinocchio-pubkey            = "0.3"
solana-program-error = "3.0.1"
shank = { version = "0.4.3", optional = true }

[features]
# Off by default so `cargo build-sbf` (the on-chain build) stays free of the
# `shank` dependency. Enabled only for `cargo check --features idl` and by
# `shank idl` when it statically parses this crate's source (see
# src/shank.rs and scripts/generate-idl.sh).
idl = ["dep:shank"]

[dev-dependencies]
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = "0.15.0"
spl-token-interface = "2.0.0"
solana-program-option = "3.0.0"
solana-program-pack = "3.0.0"
solana-sdk  = { version = "4.0.1", default-features = false, features = ["borsh"] }

[profile.release]
overflow-checks = true
opt-level       = 3
lto             = "fat"
codegen-units   = 1
