name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same ref when a newer push/PR update supersedes it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the versions in the README toolchain table — never "latest".
  RUST_VERSION: "1.89.0"
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.1.2"
  NODE_VERSION: "20.17.0"
  YARN_VERSION: "1.22.22"

jobs:
  ci:
    runs-on: ubuntu-latest
    # No continue-on-error / if-always anywhere below: a failing step stops the workflow.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Solana CLI (pinned, official Anza installer)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Official prebuilt release binary rather than `avm install` / `cargo install`: anchor-cli
      # 1.1.2's own published Cargo.lock pins a dependency requiring rustc >=1.91, which our
      # pinned 1.89.0 can't compile — this sidesteps that entirely and is faster besides.
      # otter-sec/anchor is the project's current home (coral-xyz/anchor was transferred there).
      - name: Install Anchor CLI (pinned, official release binary)
        run: |
          curl -sSfL -o anchor \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          chmod +x anchor
          sudo mv anchor /usr/local/bin/anchor

      - name: Cache target/ and node_modules/
        uses: actions/cache@v4
        with:
          path: |
            target
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: ${{ runner.os }}-cargo-yarn-${{ hashFiles('Cargo.lock', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-yarn-

      - name: anchor build
        run: anchor build

      - name: cargo test (program unit tests)
        run: cargo test --manifest-path programs/staking-vault/Cargo.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned yarn
        run: npm install -g "yarn@$YARN_VERSION"

      # --frozen-lockfile: fails instead of silently rewriting yarn.lock if it's out of sync —
      # the whole point of this workflow is proving the build is reproducible.
      - name: yarn install
        run: yarn install --frozen-lockfile

      - name: yarn test:program (LiteSVM integration + security suite)
        run: yarn test:program

      - name: yarn workspace @staking-vault/sdk build
        run: yarn workspace @staking-vault/sdk build
